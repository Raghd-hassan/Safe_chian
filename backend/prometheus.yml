global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # هذا لجمع بيانات Prometheus نفسه
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ✅ هذا لجمع بيانات الـ Backend (أضفه إذا لم يكن موجوداً)
  - job_name: "safechain_api"
    static_configs:
      - targets: ["localhost:8000"]